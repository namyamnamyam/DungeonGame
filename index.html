<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15120f" />
  <title>DUNGEON BUILDER // Placement Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="game-shell">
    <header class="topbar pixel-panel">
      <div>
        <p class="eyebrow">DUNGEON MASTER TOOLKIT</p>
        <h1>DUNGEON BUILDER</h1>
      </div>
      <button id="resetButton" class="pixel-button danger-button" type="button">RESET MAP</button>
    </header>

    <section class="workspace">
      <section class="board-panel pixel-panel" aria-labelledby="boardTitle">
        <div class="panel-title-row">
          <div>
            <span class="panel-kicker">MAP</span>
            <h2 id="boardTitle">5 × 5 DUNGEON</h2>
          </div>
          <div class="map-counter"><span id="placedCount">0</span>/25</div>
        </div>

        <div id="grid" class="dungeon-grid" role="grid" aria-label="5 by 5 dungeon placement grid"></div>

        <div class="hint-line">
          <span class="keycap">CLICK</span>
          <span>배치</span>
          <span class="divider">•</span>
          <span class="keycap">DRAG</span>
          <span>연속 배치</span>
          <span class="divider">•</span>
          <span class="keycap">ERASER</span>
          <span>오브젝트부터 삭제</span>
        </div>
      </section>

      <aside class="palette-panel pixel-panel" aria-labelledby="paletteTitle">
        <div class="panel-title-row compact">
          <div>
            <span class="panel-kicker">BUILD MENU</span>
            <h2 id="paletteTitle">PLACEMENT</h2>
          </div>
        </div>

        <section class="palette-group" aria-labelledby="terrainTitle">
          <h3 id="terrainTitle">TERRAIN</h3>
          <div class="palette-grid">
            <button class="tool-button" data-tool="wall" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>벽</span><small>WALL</small>
            </button>
            <button class="tool-button" data-tool="path" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>통로</span><small>PATH</small>
            </button>
            <button class="tool-button" data-tool="room" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>방</span><small>ROOM</small>
            </button>
          </div>
        </section>

        <section class="palette-group" aria-labelledby="trapTitle">
          <h3 id="trapTitle">TRAPS</h3>
          <div class="palette-grid">
            <button class="tool-button" data-tool="spike" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>가시</span><small>SPIKE</small>
            </button>
            <button class="tool-button" data-tool="pit" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>구덩이</span><small>PIT</small>
            </button>
            <button class="tool-button" data-tool="sticky" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>끈끈이</span><small>STICKY</small>
            </button>
          </div>
        </section>

        <section class="palette-group" aria-labelledby="monsterTitle">
          <h3 id="monsterTitle">MONSTERS</h3>
          <div class="palette-grid">
            <button class="tool-button" data-tool="slime" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>슬라임</span><small>SLIME</small>
            </button>
            <button class="tool-button" data-tool="goblin" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>고블린</span><small>GOBLIN</small>
            </button>
            <button class="tool-button" data-tool="skeleton" type="button">
              <canvas width="16" height="16" aria-hidden="true"></canvas>
              <span>스켈레톤</span><small>SKELETON</small>
            </button>
          </div>
        </section>

        <button id="eraserButton" class="eraser-button pixel-button" type="button">
          <span class="eraser-icon" aria-hidden="true">×</span>
          ERASER
        </button>
      </aside>
    </section>

    <footer class="statusbar pixel-panel">
      <div class="status-label">SELECTED</div>
      <canvas id="selectedIcon" width="16" height="16" aria-hidden="true"></canvas>
      <div class="status-copy">
        <strong id="selectedName">통로</strong>
        <span id="selectedDescription">돌바닥 통로를 배치합니다.</span>
      </div>
      <div class="status-coordinates" id="hoverInfo">X -- / Y --</div>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="game.js"></script>
</body>
</html>
